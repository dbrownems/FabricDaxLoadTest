[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fdlt-runtime"
description = "Notebook-side runtime for the FabricDaxLoadTest LoadGen tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "David Browne" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/dbrownems/FabricDaxLoadTest"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fdlt_runtime*"]

# Bundle the .NET LoadGen publish output (copied into
# src/fdlt_runtime/loadgen/ by the deploy script / release workflow
# before `python -m build`) inside the wheel. After
# `pip install fdlt_runtime-X.Y.Z-py3-none-any.whl`, runtime code
# locates LoadGen.dll via importlib.resources — no zip / unzip /
# extra upload step. See `notebook.bootstrap()`.
[tool.setuptools.package-data]
fdlt_runtime = ["loadgen/**/*"]

[tool.setuptools_scm]
write_to = "src/fdlt_runtime/_version.py"
# Allow building outside a git checkout (e.g. inside a CI tarball) by
# falling back to the env var the deploy script sets.
fallback_version = "0.0.0+unknown"

# Lint gate run by .github/workflows/ci.yml (pinned ruff version there).
# Functions already over the complexity limit carry `# noqa: C901`;
# new code should stay under it.
[tool.ruff]
target-version = "py310"
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes: unused imports/variables, undefined names
    "B",    # bugbear: likely bugs
    "ARG",  # unused arguments
    "ERA",  # commented-out code
    "C90",  # McCabe complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 15
